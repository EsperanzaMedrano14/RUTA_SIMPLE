<!--LOGIN O REGISTRO DE USUARIO, ESTO A TRAVÉS DE UNA LÓGICA DE REGISTRO DEL BACKEND-->

<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>RUTA SIMPLE LOGIN</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" type="image/x-icon" href="recursos_visuales/RUTA_SIMPLE_LOGO-Photoroom.png">
    </head>
    <body>
        <h1>Inicio de sesión</h1>
        <form id="formLogin">
            <input class="inicio" type="email" id="email_usuario" placeholder="Correo electrónico" required>
            <input class="inicio" type="password" id="contrasena" placeholder="Contraseña" required>
            <p id="mensajeError" style="color: #D24200; display: none;"></p>
            <button type="submit">Iniciar sesión</button>
        </form>

        <p>¿No tienes una cuenta? <a href="index3.html">Regístrate aquí</a></p>

        <script src="App.js" defer></script>
    </body>
</html>
