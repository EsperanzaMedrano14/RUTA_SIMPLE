<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>RUTA SIMPLE REGISTRO</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <h1>Registro de usuario</h1>
        <form id="formRegistro">
            <input class="registro" type="text" id="nombre_usuario" placeholder="Nombre completo" required>
            <input class="registro" type="email" id="email_usuario" placeholder="Correo electrónico" required>
            <input class="registro" type="password" id="contrasena" placeholder="Contraseña" required>
            <p id="mensajeError" style="color: #D24200; display: none;"></p>
            <button type="submit">Registrarse</button>
        </form>

        <p>¿Ya tienes una cuenta? <a href="index1.html">Inicia sesión aquí</a></p>

        <script src="App.js" defer></script>
    </body>
</html>
